repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(data/raw/|data/samples/|eval/privacyqa_)
      - id: trailing-whitespace
        # Policy text is third-party data, so it stays byte-for-byte as downloaded.
        exclude: ^(data/raw/|data/samples/|eval/privacyqa_)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
