[project]
name = "fine-print"
version = "0.1.0"
description = "Local, free RAG over Terms of Service and privacy policies."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pypdf>=4.0",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fine_print"]

[tool.pytest.ini_options]
testpaths = ["tests"]
